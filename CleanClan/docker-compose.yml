version: '3.8'

services:

  # 1. Para MySQL
  mysql_cleanclan:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cleanclan_db
      MYSQL_USER: cleanuser
      MYSQL_PASSWORD: cleanpw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Para PostgreSQL
  postgres_cleanclan:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: cleanclan_db
      POSTGRES_USER: cleanuser
      POSTGRES_PASSWORD: cleanpw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Para MariaDB
  mariadb_cleanclan:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: cleanclan_db
      MARIADB_USER: cleanuser
      MARIADB_PASSWORD: cleanpw
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # 4. Para Redis
  redis_cleanclan:
    image: redis/redis-stack:latest
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  postgres_data:
  mariadb_data:
  redis_data: